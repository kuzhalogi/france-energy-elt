<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="France energy ELT pipeline architecture">
  <title>France energy ELT pipeline architecture</title>
  <desc>Data flows from the ODRE API through extract, preprocess, and load steps into a Postgres raw schema, then dbt models it through staging and intermediate into a marts star schema. The whole flow is orchestrated by Airflow.</desc>
  <rect x="0" y="0" width="880" height="470" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6472"/>
    </marker>
  </defs>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#1a1f29">France Energy ELT: Pipeline Architecture</text>
  <text x="40" y="64" font-size="13" fill="#5b6472">Data moves left to right and gets cleaner at each stage.</text>
  <rect x="40" y="92" width="800" height="70" rx="8" fill="#eef2ff" stroke="#c3ccf7" stroke-width="1.5"/>
  <text x="56" y="114" font-size="12" font-weight="700" fill="#3a46b3">AIRFLOW DAG: @daily schedule, LocalExecutor, Docker</text>
  <text x="56" y="132" font-size="11" fill="#6670c7">extract → preprocess → load → dbt_build</text>
  <text x="740" y="132" font-size="11" fill="#6670c7" text-anchor="end">retries on IO steps</text>
  <rect x="40" y="200" width="130" height="80" rx="8" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <text x="105" y="230" font-size="13" font-weight="700" fill="#0c447c" text-anchor="middle">ODRE API</text>
  <text x="105" y="250" font-size="10.5" fill="#0c447c" text-anchor="middle">OpenDataSoft</text>
  <text x="105" y="264" font-size="10.5" fill="#0c447c" text-anchor="middle">Explore v2.1</text>
  <rect x="205" y="200" width="130" height="80" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
  <text x="270" y="226" font-size="13" font-weight="700" fill="#633806" text-anchor="middle">Raw CSVs</text>
  <text x="270" y="246" font-size="10.5" fill="#633806" text-anchor="middle">data/raw/</text>
  <text x="270" y="262" font-size="10" fill="#9a7a3a" text-anchor="middle">extract.py</text>
  <rect x="370" y="200" width="130" height="80" rx="8" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
  <text x="435" y="226" font-size="13" font-weight="700" fill="#633806" text-anchor="middle">Clean CSVs</text>
  <text x="435" y="246" font-size="10.5" fill="#633806" text-anchor="middle">data/processed/</text>
  <text x="435" y="262" font-size="10" fill="#9a7a3a" text-anchor="middle">preprocess.py + checks</text>
  <rect x="535" y="200" width="130" height="80" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="1.5"/>
  <text x="600" y="226" font-size="13" font-weight="700" fill="#085041" text-anchor="middle">raw schema</text>
  <text x="600" y="246" font-size="10.5" fill="#085041" text-anchor="middle">Postgres (bronze)</text>
  <text x="600" y="262" font-size="10" fill="#3f8a76" text-anchor="middle">load.py · COPY</text>
  <rect x="700" y="200" width="140" height="80" rx="8" fill="#eaf3de" stroke="#3b6d11" stroke-width="1.5"/>
  <text x="770" y="226" font-size="13" font-weight="700" fill="#27500a" text-anchor="middle">marts</text>
  <text x="770" y="246" font-size="10.5" fill="#27500a" text-anchor="middle">star schema</text>
  <text x="770" y="262" font-size="10" fill="#5a8a2f" text-anchor="middle">dbt</text>
  <line x1="170" y1="240" x2="203" y2="240" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="187" y="232" font-size="9.5" fill="#5b6472" text-anchor="middle">extract</text>
  <line x1="335" y1="240" x2="368" y2="240" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="351" y="232" font-size="9.5" fill="#5b6472" text-anchor="middle">clean</text>
  <line x1="500" y1="240" x2="533" y2="240" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="516" y="232" font-size="9.5" fill="#5b6472" text-anchor="middle">load</text>
  <line x1="665" y1="240" x2="698" y2="240" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="681" y="232" font-size="9.5" fill="#5b6472" text-anchor="middle">dbt</text>
  <rect x="535" y="320" width="305" height="110" rx="8" fill="#f4f9ec" stroke="#a9cd82" stroke-width="1.5"/>
  <text x="551" y="342" font-size="11" font-weight="700" fill="#3b6d11">dbt transform (in Postgres)</text>
  <rect x="551" y="352" width="80" height="30" rx="5" fill="#ffffff" stroke="#7fae4e" stroke-width="1.2"/>
  <text x="591" y="371" font-size="10.5" fill="#3b6d11" text-anchor="middle">staging</text>
  <rect x="655" y="352" width="90" height="30" rx="5" fill="#ffffff" stroke="#7fae4e" stroke-width="1.2"/>
  <text x="700" y="371" font-size="10.5" fill="#3b6d11" text-anchor="middle">intermediate</text>
  <rect x="769" y="352" width="55" height="30" rx="5" fill="#ffffff" stroke="#7fae4e" stroke-width="1.2"/>
  <text x="796" y="371" font-size="10.5" fill="#3b6d11" text-anchor="middle">marts</text>
  <line x1="631" y1="367" x2="653" y2="367" stroke="#5b6472" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="745" y1="367" x2="767" y2="367" stroke="#5b6472" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="551" y="404" font-size="10" fill="#5a7040">cast types → aggregate ½-hourly to daily → dimensional model</text>
  <text x="551" y="420" font-size="10" fill="#5a7040">dim_region · dim_date · fact_consumption · fact_weather · fact_production</text>
  <line x1="770" y1="280" x2="770" y2="318" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="40" y="342" font-size="11" font-weight="700" fill="#1a1f29">Legend</text>
  <rect x="40" y="352" width="14" height="14" rx="3" fill="#e6f1fb" stroke="#185fa5"/>
  <text x="60" y="363" font-size="10.5" fill="#3a4150">external source</text>
  <rect x="40" y="372" width="14" height="14" rx="3" fill="#faeeda" stroke="#854f0b"/>
  <text x="60" y="383" font-size="10.5" fill="#3a4150">files on disk</text>
  <rect x="40" y="392" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="60" y="403" font-size="10.5" fill="#3a4150">database (raw)</text>
  <rect x="40" y="412" width="14" height="14" rx="3" fill="#eaf3de" stroke="#3b6d11"/>
  <text x="60" y="423" font-size="10.5" fill="#3a4150">modeled marts</text>
</svg>
